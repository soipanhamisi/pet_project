<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New Pet Listing</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="addnewpet.css">
</head>
<body>

<div class="form-container">
  <h2 class="text-center mb-4">Add New Pet</h2>
  <p class="text-center text-muted">Add a new listing for a pet for either adoption or sale</p>

  <form action="/add-new" method="POST" enctype="multipart/form-data">
    <!-- Thumbnail Section -->
    <div class="row mb-3">
      <div class="col-md-4 thumbnail">
        <img src="https://via.placeholder.com/150" alt="Pet Thumbnail">
        <label class="upload-btn">
          Upload Image
          <input type="file" name="thumbnail" accept=".jpg,.jpeg,.png" class="form-control" style="display: none;">
        </label>
        <small class="text-muted">Only .png, .jpg, .jpeg files accepted</small>
      </div>

      <!-- Details Section -->
      <div class="col-md-8">
        <div class="mb-3">
          <label for="title" class="form-label">Title *</label>
          <input type="text" class="form-control" id="title" name="title" placeholder="Enter a name" required>
        </div>
        <div class="mb-3">
          <label for="description" class="form-label">Description *</label>
          <textarea class="form-control" id="description" name="description" rows="3" placeholder="Description text goes here" required></textarea>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="age" class="form-label">Age *</label>
            <select class="form-select" id="age" name="age" required>
              <option value="">Select age</option>
              <option value="Puppy/Kitten">Puppy/Kitten</option>
              <option value="Young">Young</option>
              <option value="Adult">Adult</option>
              <option value="Senior">Senior</option>
            </select>
          </div>
          <div class="col-md-6 mb-3">
            <label for="gender" class="form-label">Gender *</label>
            <select class="form-select" id="gender" name="gender" required>
              <option value="">Select gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Additional Details -->
    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="vaccinationCertificate" class="form-label">Vaccination Certificate *</label>
        <input type="file" class="form-control" id="vaccinationCertificate" name="vaccinationCertificate" accept=".pdf,.jpg,.jpeg,.png" required>
        <small class="text-muted">Max size: 5MB</small>
      </div>
      <div class="col-md-6 mb-3">
        <label for="checklist" class="form-label">Checklist</label>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="vaccinated" name="checklist[]" value="Vaccinated">
          <label class="form-check-label" for="vaccinated">Vaccinated</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="dewormed" name="checklist[]" value="Dewormed">
          <label class="form-check-label" for="dewormed">Dewormed</label>
        </div>
      </div>
    </div>

    <!-- Pricing and Category -->
    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="category" class="form-label">Category</label>
        <select class="form-select" id="category" name="category" required>
          <option value="Dog">Dog</option>
          <option value="Cat">Cat</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="col-md-6 mb-3">
        <label for="basePrice" class="form-label">Base Price *</label>
        <div class="input-group">
          <input type="number" class="form-control" id="basePrice" name="basePrice" placeholder="Price goes here" required>
          <span class="input-group-text">KSH</span>
        </div>
      </div>
    </div>

    <div class="mb-3">
      <label for="discountType" class="form-label">Discount Type *</label>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="discountType" id="noDiscount" value="No Discount" checked>
        <label class="form-check-label" for="noDiscount">No Discount</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="discountType" id="percentage" value="Percentage">
        <label class="form-check-label" for="percentage">Percentage</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="discountType" id="fixedPrice" value="Fixed Price">
        <label class="form-check-label" for="fixedPrice">Fixed Price</label>
      </div>
    </div>

    <!-- Form Footer -->
    <div class="form-footer">
      <a href="/login" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
