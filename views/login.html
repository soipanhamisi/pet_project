<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetWorld Login</title>
    <link rel="stylesheet" href="css/login_style.css">
</head>
<body>
    <div class="container">
        
        <div class="form-container">
            <div class="logo">
                <img src="images/Logo (2).png" alt="PetWorld Logo">
            </div>
            <h2>Log In</h2>
            <form action="/login" id="loginForm" method="post">
                <div class="form-group">
                    <label for="email">Email </label>
                    <input type="text" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit">Log In</button>
                <a href="#" class="forgot-password">Forgot password?</a>
                <div class="social-login">
                    <button class="google-login">
                        <img src="images/Group 427320702 (2).png" alt="Google Logo">
                        <span>Google</span>
                    </button>
                    <button class="facebook-login">
                        <img src="images/XMLID_17_.png" alt="Facebook Logo">
                        <span>Facebook</span>
                    </button>
                </div>
            </form>
            <p>Don't have an account? <a href="/signup">Sign Up</a></p>
        </div>
        <div class="image-container">
            <img src="images/Rectangle 2776 (2).png" alt="Dog Image">
        </div>
    </div>

    <script type="module" src="login_page.js"></script>
</body>
</html>
