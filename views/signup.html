<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="./sign_up_style.css">
</head>
<body>
    <div class="container">
        <h1>Sign Up</h1>
        <form id="signUpForm">
            <div class="form-group">
                <label for="username"><i class="fa fa-user"></i> Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label for="email"><i class="fa fa-envelope"></i> Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="password"><i class="fa fa-lock"></i> Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password">
            </div>
            <div class="form-group">
                <label for="confirm-password"><i class="fa fa-lock"></i> Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password">
            </div>
            <button type="submit">Sign Up</button>
            <p>or</p>
            <div class="social-login">
                <button class="google-login">
                    <img src="images/Group 427320702 (2).png" alt="Google Logo">
                    <span>Google</span>
                </button>
                <button class="facebook-login">
                    <img src="images/XMLID_17_.png" alt="Facebook Logo">
                    <span>Facebook</span>
                </button>
            </div>
            <p>Already have an account? <a href="#">Log In</a></p>
        </form>
    </div>

    <script type="module">
        import { createUserWithEmailAndPassword } from './firebase.js'; // Import the function
      
        const signUpForm = document.getElementById('signUpForm');
      
        signUpForm.addEventListener('submit', (e) => {
          e.preventDefault();
      
          const email = document.getElementById('email').value;
          const password = document.getElementById('password').value;
      
          createUserWithEmailAndPassword(auth, email, password)
            .then((userCredential) => {
              const user = userCredential.user;
              console.log('User signed up: ', user);
              // Redirect or update UI after successful signup
            })
            .catch((error) => {
              const errorCode = error.code;
              const errorMessage = error.message;
              console.error('Error signing up: ', errorCode, errorMessage);
            });
        });
      </script>

</body>
</html>
