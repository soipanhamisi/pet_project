<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="./sign_up_style.css">
    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
    <!-- Firebase Firestore -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js"></script>
    </head>
<body>
    <div class="container">
        <h1>Sign Up</h1>
        <form action="/signup" method="post" id="signupForm" class="form">
            <div class="form-group">
                <label for="username"><i class="fa fa-user"></i> Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label for="email"><i class="fa fa-envelope"></i> Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="password"><i class="fa fa-lock"></i> Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password">
            </div>
            <div class="form-group">
                <label for="confirm-password"><i class="fa fa-lock"></i> Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password">
            </div>
            <button type="submit">Sign Up</button>
            <p>or</p>
            <div class="social-login">
                <button class="google-login">
                    <img src="images/Group 427320702 (2).png" alt="Google Logo">
                    <span>Google</span>
                </button>
                <button class="facebook-login">
                    <img src="images/XMLID_17_.png" alt="Facebook Logo">
                    <span>Facebook</span>
                </button>
            </div>
            <p>Already have an account? <a href="/login">Log In</a></p>
        </form>
    </div>

    <script>
        document.getElementById('signUpForm').addEventListener('submit', function(event) {
          event.preventDefault(); // Prevent the default form submission
      
          // Get form values
          const username = document.getElementById('username').value;
          const email = document.getElementById('email').value;
          const password = document.getElementById('password').value;
          const confirmPassword = document.getElementById('confirm-password').value;

</body>
</html>
