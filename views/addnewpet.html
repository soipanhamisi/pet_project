<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New Pet Listing</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./addnewpet.css">
  <link rel="stylesheet" href="css/navbar&footer.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">
            <img src="images/Logo.png" alt="Your Logo" height="30">
          </a>
        
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item active">
                    <a class="nav-link" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/catalogue">explore</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/services">Services and Testimonials</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="/newpet">Donate a Pet</a>
              </li>
                <li class="nav-item">
                    <a href="/login">
                        <button class="navbar-button">login</button>
                    </a>
                </li>
            </ul>
        </div>
    </nav>
</header>

<div class="form-container">
  <h2 class="text-center mb-4">Add New Pet</h2>
  <p class="text-center text-muted">Add a new listing for a pet for either adoption or sale</p>

  <form action="/newpet" method="POST">
    <!-- Thumbnail Section -->
    <!--div class="row mb-3">
      <div class="col-md-4 thumbnail">
        <img src="https://via.placeholder.com/150" alt="Pet Thumbnail">
        <label class="upload-btn">
          Upload Image
          <input type="file" name="thumbnail" accept=".jpg,.jpeg,.png" class="form-control" style="display: none;">
        </label>
        <small class="text-muted">Only .png, .jpg, .jpeg files accepted</small>
      </div-->

      <!-- Details Section -->
      <div class="col-md-8">
        <div class="mb-3">
          <label for="title" class="form-label">Pet Nick Name</label>
          <input type="text" class="form-control" id="nickname" name="nickname" placeholder="Enter a name" required>
        </div>
        <div class="col-md-8">
          <div class="mb-3">
            <label for="title" class="form-label">Pet Breed</label>
            <input type="text" class="form-control" id="breedname" name="breedname" placeholder="Enter the pet's Breed" required>
          </div>
        <div class="mb-3">
          <label for="description" class="form-label">Description</label>
          <textarea class="form-control" id="description" name="description" rows="3" placeholder="Description text goes here" required></textarea>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="age" class="form-label">Age *</label>
            <select class="form-select" id="age" name="age" required>
              <option value="">Select age</option>
              <option value="Puppy/Kitten">Puppy/Kitten</option>
              <option value="Young">Young</option>
              <option value="Adult">Adult</option>
              <option value="Senior">Senior</option>
            </select>
          </div>
          <div class="col-md-6 mb-3">
            <label for="gender" class="form-label">Gender *</label>
            <select class="form-select" id="gender" name="gender" required>
              <option value="">Select gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
          </div>
        </div>
      </div>
    </div>

      <div class="col-md-6 mb-3">
        <label for="checklist" class="form-label">Checklist</label>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="vaccinated" name="checklist" value="Vaccinated">
          <label class="form-check-label" for="vaccinated">Vaccinated</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="dewormed" name="checklist" value="Dewormed">
          <label class="form-check-label" for="dewormed">Dewormed</label>
        </div>
      </div>
    </div>

    <!-- Pricing and Category -->
    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="category" class="form-label">Category</label>
        <select class="form-select" id="category" name="category" required>
          <option value="Dog">Dog</option>
          <option value="Cat">Cat</option>
          <option value="Other">Other</option>
        </select>
      </div>
  

    <!-- Form Footer -->
    <div class="form-footer">
      <a href="/" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
